name: backend-test

on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare artifacts directory
        run: |
          mkdir -p artifacts
          chmod 777 artifacts

      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker compose -f docker-compose.yml build


  budget-test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4


      - name: Build images
        run: docker compose -f docker-compose.yml build

      - name: Start stack
        run: docker compose -f docker-compose.yml up -d

      - name: Run API memory budget test
        id: budget
        run: |
          OUT=$(docker compose -f docker-compose.yml run --rm test pytest -q tests/test_budget.py)
          echo "$OUT"
          echo "mem=$(echo "$OUT" | grep MEMORY_USAGE | cut -d= -f2)" >> $GITHUB_OUTPUT


      - name: Add memory usage to summary
        run: |
          echo "### Memory Budget Test Passed" >> $GITHUB_STEP_SUMMARY
          echo "Memory used: ${{ steps.budget.outputs.mem }} MB (below max memory of 200 MB)" >> $GITHUB_STEP_SUMMARY


      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml down




  stability-test:
    needs: budget-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4


      - name: Prepare artifacts directory
        run: |
          mkdir -p artifacts
          chmod 777 artifacts


      - name: Build images
        run: docker compose -f docker-compose.yml build

      - name: Start stack
        run: docker compose -f docker-compose.yml up -d

      - name: Run endpoint stability tests
        run: docker compose -f docker-compose.yml run --rm test pytest tests/test_concurrency.py

      - name: Upload concurrency plot
        uses: actions/upload-artifact@v4
        with:
          name: concurrency-plot
          path: artifacts/concurrency_plot.png

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml down



