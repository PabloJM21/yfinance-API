version: "3.9"

services:
  # Shared Redis instance for all backend replicas
  redis:
    image: redis:7
    networks:
      - my_network

  # Backend replica 1
  backend-1:
    build:
      context: .
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - my_network

  # Backend replica 2
  backend-2:
    build:
      context: .
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - my_network

  # Backend replica 3
  backend-3:
    build:
      context: .
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - my_network

  # NGINX load balancer
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    networks:
      - my_network

networks:
  my_network:
